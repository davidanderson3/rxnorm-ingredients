<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RxNorm Ingredients Browser</title>
    <style>
      :root { --fg:#0b1020; --muted:#667; --bg:#fff; --hl:#0658f6; --chip:#eef3ff; }
      html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}
      header{padding:12px 16px;border-bottom:1px solid #e5e8f0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
      h1{font-size:16px;margin:0}
      h3{font-size:16px;margin:0}
      .version{font-size:12px;white-space:nowrap}
      .letters{display:flex;gap:6px;flex-wrap:wrap}
      .letters button{padding:6px 9px;border:1px solid #d7dbe6;background:#fff;border-radius:6px;cursor:pointer}
      .letters button.active{background:var(--chip);border-color:var(--hl);color:var(--hl)}
      .search{margin-left:auto;display:flex;gap:8px;align-items:center}
      .search input{padding:8px 10px;border:1px solid #ccd3e0;border-radius:6px;min-width:220px}
      main{display:grid;grid-template-columns:320px 1fr 1fr 1fr;min-height:calc(100vh - 52px)}
      aside{border-right:1px solid #e5e8f0;overflow:auto}
      .list-header{padding:8px 12px;font-weight:600;border-bottom:1px solid #f0f2f7;background:#fafbfe}
      #list{list-style:none;margin:0;padding:0}
      #list li{padding:10px 12px;border-bottom:1px solid #f0f2f7;cursor:pointer}
      #list li:hover{background:#fafbfe}
      #list li.active{background:#f6f8fe;border-left:3px solid var(--hl)}
      #list .name{font-weight:600}
      #list .meta{color:var(--muted);font-size:12px}
      section{padding:12px 16px;overflow:auto;border-right:1px solid #e5e8f0}
      .concept-name{font-size:15px;font-weight:700;line-height:1.35}
      .brand-name{font-size:16px;font-weight:700;line-height:1.35}
      .concept-name strong,.brand-name strong{font-weight:800}
      .pill{display:inline-block;background:var(--chip);color:var(--hl);border:1px solid var(--hl);padding:2px 6px;border-radius:999px;font-size:12px;margin-left:6px}
      details{margin:8px 0}
      summary{cursor:pointer}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
      .card{border:1px solid #e5e8f0;border-radius:8px;padding:8px}
      .line{display:flex;gap:6px;align-items:center}
      .tag{font-size:11px;background:#f4f6fb;border:1px solid #e5e8f0;border-radius:4px;padding:1px 4px;color:#445}
      .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
      .rxcui-line{margin-left:14px}
      .muted{color:var(--muted)}
      .list{list-style:none;margin:0;padding:0}
      .list li{padding:8px 10px;border-bottom:1px solid #f0f2f7;cursor:pointer}
      .list li.active{background:#f6f8fe}
      .nested-list li{cursor:default}
      .card .nested-list{border-left:2px solid #e5e8f0;margin-top:6px;margin-left:8px;padding-left:10px}
      .card .nested-list li{padding-left:8px}
      .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
      .section-head{margin:8px 0 6px;padding:8px 10px;border:1px solid #cfe6d8;border-radius:8px;background:#f1f8f4}
      .section-head h3{font-weight:700}
      .section-sub{color:var(--muted);margin-top:2px}
      .chip-link{font-size:12px;padding:2px 6px;border-radius:999px;border:1px solid #b9c6f8;background:#eef3ff;color:#2a56cc;text-decoration:none}
      .rxnav-link{color:var(--hl);text-decoration:none}
      .rxnav-link:hover{text-decoration:underline}
      .subtle-rule{border:0;border-top:1px solid #e5e8f0;margin:10px 0 8px}
      .sql-panel{border-top:1px solid #dfe4ee;background:#fbfcff;padding:12px 16px 16px}
      .sql-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
      .sql-toolbar button{padding:6px 10px;border:1px solid #ccd3e0;border-radius:6px;background:#fff;cursor:pointer;white-space:nowrap}
      .sql-toolbar button:disabled{cursor:not-allowed;color:#99a;background:#f7f8fb}
      #sqlQuery{box-sizing:border-box;width:100%;min-height:80px;overflow:hidden;resize:none;border:1px solid #ccd3e0;border-radius:6px;background:#fff;color:#182033;padding:10px;font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
    </style>
  </head>
  <body>
    <header>
      <h1>RxNorm Ingredients</h1>
      <span id="version" class="version muted"></span>
      <div class="letters" id="letters"></div>
      
    </header>
    <main>
      <aside>
        <div class="search" style="padding:10px 12px;border-bottom:1px solid #f0f2f7;">
          <input id="q" placeholder="Filter in current letter… (e.g., mesna)" />
          <span id="count" class="muted"></span>
        </div>
        <div class="list-header">Ingredients</div>
        <ul id="list"></ul>
      </aside>
      <section>
        <div id="scdcCol" class="muted">SCDCs will appear here.</div>
      </section>
      <section>
        <div id="scdCol" class="muted">SCDs will appear here.</div>
      </section>
      <section>
        <div id="sbdCol" class="muted">SBDs will appear here.</div>
      </section>
    </main>
    <div class="sql-panel">
      <div class="sql-toolbar">
        <div>
          <h3>Oracle SQL</h3>
          <div id="sqlSummary" class="section-sub">Select an ingredient to generate a UNII to NDC query.</div>
        </div>
        <button id="copySql" type="button" disabled>Copy SQL</button>
      </div>
      <textarea id="sqlQuery" readonly spellcheck="false">Select an ingredient to generate a query.</textarea>
    </div>
    <script>
      const state = { manifest:null, bucketKey:null, records:[], filtered:[], selected:null, selectedScdc:null, selectedScd:null };
      const lettersEl = document.getElementById('letters');
      const listEl = document.getElementById('list');
      const scdcCol = document.getElementById('scdcCol');
      const scdCol = document.getElementById('scdCol');
      const sbdCol = document.getElementById('sbdCol');
      const countEl = document.getElementById('count');
      const qEl = document.getElementById('q');
      const versionEl = document.getElementById('version');
      const sqlSummaryEl = document.getElementById('sqlSummary');
      const sqlQueryEl = document.getElementById('sqlQuery');
      const copySqlBtn = document.getElementById('copySql');

      fetch('manifest.json').then(r=>r.json()).then(async mf=>{
        state.manifest = mf;
        renderLetters(mf);
        const urlState = readUrlState();
        const first = mf.find(x=>x.key==='A') || mf[0];
        const queryKey = bucketKeyForText(urlState.q);
        const initialKey = manifestHasKey(urlState.bucketKey) ? urlState.bucketKey
          : (manifestHasKey(queryKey) ? queryKey : (first && first.key));
        if(urlState.q){ qEl.value = urlState.q; }
        if (initialKey) await selectLetter(initialKey, { preserveQuery: true, restore: urlState, updateUrl: false });
        updateUrlState();
      }).catch(err=>{
        scdcCol.textContent = 'Failed to load manifest.json. Serve this folder via a local HTTP server (e.g., python3 -m http.server).';
      });
      fetch('metadata.json').then(r=>r.ok ? r.json() : Promise.reject()).then(meta=>{
        const version = meta.rxnorm_version || '';
        const releaseType = meta.rxnorm_release_type || '';
        const label = meta.rxnorm_release_label || '';
        if(version){
          versionEl.textContent = releaseType ? `${releaseType} · Version ${version}` : `Version ${version}`;
          if(label){ versionEl.title = label; }
        } else if(releaseType){
          versionEl.textContent = releaseType;
          if(label){ versionEl.title = label; }
        } else if(label){
          versionEl.textContent = label;
        }
      }).catch(()=>{});

      window.addEventListener('resize', resizeSqlQuery);

      copySqlBtn.addEventListener('click', async ()=>{
        const sql = sqlQueryEl.value || '';
        if(!sql || copySqlBtn.disabled) return;
        try {
          if(navigator.clipboard && navigator.clipboard.writeText){
            await navigator.clipboard.writeText(sql);
          } else {
            sqlQueryEl.focus();
            sqlQueryEl.select();
            document.execCommand('copy');
          }
          const old = copySqlBtn.textContent;
          copySqlBtn.textContent = 'Copied';
          setTimeout(()=>{ copySqlBtn.textContent = old; }, 1200);
        } catch {
          sqlQueryEl.focus();
          sqlQueryEl.select();
        }
      });

      function renderLetters(mf){
        lettersEl.innerHTML = '';
        mf.forEach(entry=>{
          const b = document.createElement('button');
          b.textContent = entry.label;
          b.title = `${entry.label} (${entry.count})`;
          b.onclick = ()=> selectLetter(entry.key);
          b.dataset.key = entry.key;
          lettersEl.appendChild(b);
        });
      }

      function setActiveLetter(key){
        [...lettersEl.querySelectorAll('button')].forEach(btn=>{
          btn.classList.toggle('active', btn.dataset.key===key);
        });
      }

      function readUrlState(){
        const params = new URLSearchParams(window.location.search);
        return {
          bucketKey: params.get('bucket') || '',
          q: params.get('q') || '',
          ingredient: params.get('ingredient') || '',
          scdc: params.get('scdc') || '',
          scd: params.get('scd') || '',
        };
      }

      function bucketKeyForText(value){
        const ch = (value || '').trim().charAt(0).toUpperCase();
        if(ch >= 'A' && ch <= 'Z') return ch;
        if(ch >= '0' && ch <= '9') return '0-9';
        return null;
      }

      function manifestHasKey(key){
        return !!(key && state.manifest && state.manifest.find(e=>e.key===key));
      }

      function updateUrlState(){
        if(!state.manifest || !state.bucketKey) return;
        const params = new URLSearchParams();
        params.set('bucket', state.bucketKey);
        const q = qEl.value.trim();
        if(q){ params.set('q', q); }
        if(state.selected){ params.set('ingredient', state.selected.RXCUI); }
        if(state.selectedScdc){ params.set('scdc', state.selectedScdc.RXCUI); }
        if(state.selectedScd){ params.set('scd', state.selectedScd.RXCUI); }
        const nextUrl = `${window.location.pathname}?${params.toString()}${window.location.hash}`;
        window.history.replaceState(null, '', nextUrl);
      }

      function filterRecords(){
        const q = qEl.value.trim().toLowerCase();
        state.filtered = state.records.filter(r => {
          if(q && !(r.Name||'').toLowerCase().includes(q)) return false;
          return true;
        });
      }

      function restoreSelections(urlState){
        if(!urlState || !urlState.ingredient) return;
        const selected = state.records.find(r=>r.RXCUI===urlState.ingredient);
        if(!selected) return;
        state.selected = selected;
        const scdcs = selected.SCDCs || [];
        state.selectedScdc = urlState.scdc ? (scdcs.find(x=>x.RXCUI===urlState.scdc) || null) : null;
        if(!state.selectedScdc && scdcs.length === 1){ state.selectedScdc = scdcs[0]; }
        const scds = (state.selectedScdc && state.selectedScdc.SCDs) || [];
        state.selectedScd = urlState.scd ? (scds.find(x=>x.RXCUI===urlState.scd) || null) : null;
        if(!state.selectedScd && scds.length === 1){ state.selectedScd = scds[0]; }
      }

      async function selectLetter(key, opts={}){
        state.bucketKey = key; setActiveLetter(key);
        const ent = state.manifest.find(x=>x.key===key);
        if(!ent) return;
        listEl.innerHTML = '<li class="muted">Loading…</li>';
        const data = await fetch(ent.file).then(r=>r.json());
        state.records = data; state.filtered = data; state.selected = null; state.selectedScdc=null; state.selectedScd=null;
        if(!opts.preserveQuery){ qEl.value=''; }
        filterRecords();
        restoreSelections(opts.restore);
        renderList(); renderScdcCol(); renderScdCol(); renderSbdCol(); renderSqlPanel();
        if(opts.updateUrl !== false){ updateUrlState(); }
      }

      qEl.addEventListener('input', ()=>{ applyFilters(); });

      async function applyFilters(){
        const qRaw = qEl.value;
        // If query starts with a letter or digit, auto-switch letter bucket
        if(qRaw && qRaw.length){
          const ch = qRaw[0].toUpperCase();
          let key = null;
          if(ch >= 'A' && ch <= 'Z'){ key = ch; }
          else if(ch >= '0' && ch <= '9'){ key = '0-9'; }
          if(key && key !== state.bucketKey && state.manifest && state.manifest.find(e=>e.key===key)){
            await selectLetter(key, { preserveQuery: true });
            return;
          }
        }
        filterRecords();
        renderList();
        updateUrlState();
      }


      function renderList(){
        listEl.innerHTML = '';
        countEl.textContent = `${state.filtered.length} shown`;
        const chunk = 100;
        let i=0;
        function pump(){
          const end = Math.min(i+chunk, state.filtered.length);
          for(; i<end; i++){
            const r = state.filtered[i];
            const li = document.createElement('li');
            let links = '';
            if(r.SPL_SET_IDs && r.SPL_SET_IDs.length){
              links = `<div>${renderDailyMedLink(r.SPL_SET_IDs)}</div>`;
            }
            li.innerHTML = `<div class="name">${escapeHtml(r.Name)} <span class="pill">${r.TTY}</span></div>
                            <div class="meta mono"><strong>RXCUI</strong> ${renderRxcui(r.RXCUI)}${r.UNII?` · <strong>UNII</strong> ${r.UNII}`:''}</div>
                            ${links}`;
            li.dataset.rxcui = r.RXCUI;
            if(state.selected && state.selected.RXCUI === r.RXCUI){ li.classList.add('active'); }
            li.onclick = ()=>{
              state.selected = r; state.selectedScdc = null; state.selectedScd = null;
              // auto-select when there is a single SCDC and/or SCD
              if(r.SCDCs && r.SCDCs.length === 1){
                state.selectedScdc = r.SCDCs[0];
                const scds = (state.selectedScdc.SCDs||[]);
                if(scds.length === 1){ state.selectedScd = scds[0]; }
              }
              // highlight selected in list
              listEl.querySelectorAll('li').forEach(el=>{
                el.classList.toggle('active', el.dataset.rxcui === r.RXCUI);
              });
              renderScdcCol(); renderScdCol(); renderSbdCol(); renderSqlPanel();
              updateUrlState();
              try { window.scrollTo(0, 0); } catch {}
            };
            listEl.appendChild(li);
          }
          if(i < state.filtered.length){ requestAnimationFrame(pump); }
        }
        pump();
      }

      // no ingredient detail column; info is shown in other columns

      function renderScdcCol(){
        const r = state.selected;
        if(!r || !r.SCDCs || !r.SCDCs.length){ scdcCol.innerHTML = '<span class="muted">Select an ingredient from the list.</span>'; return; }
        let html = `<div class="section-head"><h3>SCDCs (Semantic Clinical Drug Components)</h3><div class="section-sub">(ingredient + strength)</div></div><ul class="list">`;
        r.SCDCs.forEach(scdc=>{
          const active = state.selectedScdc && state.selectedScdc.RXCUI===scdc.RXCUI;
          html += `<li class="${active?'active':''}" data-rxcui="${scdc.RXCUI}"><div class="concept-name"><strong>${escapeHtml(scdc.Name)}</strong> <span class="pill">${scdc.TTY}</span></div>
                   <div class="mono muted rxcui-line"><strong>RXCUI</strong> ${renderRxcui(scdc.RXCUI)}</div></li>`;
        });
        html += `</ul>`;
        scdcCol.innerHTML = html;
        scdcCol.querySelectorAll('li').forEach(li=>{
          li.onclick = ()=>{
            const cui = li.getAttribute('data-rxcui');
            state.selectedScdc = r.SCDCs.find(x=>x.RXCUI===cui) || null;
            // If only one SCD under this SCDC, auto-select it; otherwise clear
            const scds = (state.selectedScdc && state.selectedScdc.SCDs) || [];
            state.selectedScd = (scds.length === 1) ? scds[0] : null;
            renderScdcCol(); renderScdCol(); renderSbdCol(); renderSqlPanel();
            updateUrlState();
          };
        });
      }

      function renderScdCol(){
        const scdc = state.selectedScdc;
        if(!scdc){ scdCol.innerHTML = '<span class="muted">Pick an SCDC to see SCDs.</span>'; return; }
        const scds = scdc.SCDs || [];
        let html = `<div class="section-head"><h3>SCDs (${scds.length})</h3><div class="section-sub">(ingredient + strength + dose form)</div></div><ul class="list">`;
        scds.forEach(scd=>{
          const active = state.selectedScd && state.selectedScd.RXCUI===scd.RXCUI;
          html += `<li class="${active?'active':''}" data-rxcui="${scd.RXCUI}"><div class="concept-name"><strong>${escapeHtml(scd.Name)}</strong> <span class="pill">${scd.TTY}</span></div>
                   <div class="mono muted rxcui-line"><strong>RXCUI</strong> ${renderRxcui(scd.RXCUI)}</div>`;
          // Separate dropdowns for identifiers
          if(scd.NDCs && scd.NDCs.length){
            const urlN = buildDailyMedSearchUrl(null, scd.NDCs);
            html += `<details><summary>NDCs</summary><div class="mono">${scd.NDCs.join(', ')}</div><div><a href="${urlN}" target="_blank" rel="noopener">DailyMed</a></div></details>`;
          }
          if(scd.SPL_SET_IDs && scd.SPL_SET_IDs.length){
            const urlS = buildDailyMedSearchUrl(scd.SPL_SET_IDs, null);
            html += `<details><summary>SPL Set IDs</summary><div class="mono">${scd.SPL_SET_IDs.join(', ')}</div><div><a href="${urlS}" target="_blank" rel="noopener">DailyMed</a></div></details>`;
          }
          html += `</li>`;
        });
        html += `</ul>`;
        // GPCKs section (not tied to a specific SCD)
        const gpckMap = new Map();
        scds.forEach(s=>{
          (s.GPCKs||[]).forEach(p=>{
            gpckMap.set(p.RXCUI, p);
          });
        });
        if(gpckMap.size){
          const gpcks = Array.from(gpckMap.values()).sort((a,b)=> (a.Name||'').localeCompare(b.Name||''));
          html += `<div class="section-head"><h3>GPCKs (${gpcks.length})</h3><div class="section-sub">{X (ingredient + strength + dose form) / Y (ingredient + strength + dose form)} Pack. X and Y are quantities (e.g., number of pills for each product).</div></div>`;
          html += renderPackListBare(gpcks);
        }
        scdCol.innerHTML = html;
        scdCol.querySelectorAll('li').forEach(li=>{
          li.onclick = ()=>{
            const cui = li.getAttribute('data-rxcui');
            state.selectedScd = (scdc.SCDs||[]).find(x=>x.RXCUI===cui) || null;
            renderScdCol(); renderSbdCol(); renderSqlPanel();
            updateUrlState();
          };
        });
        // Keep details toggles from re-selecting the SCD and re-rendering
        scdCol.querySelectorAll('details, summary').forEach(el=>{
          el.addEventListener('click', (e)=> e.stopPropagation());
        });
      }

      function renderSbdCol(){
        const scd = state.selectedScd;
        if(!scd){
          const scdc = state.selectedScdc;
          if(!scdc){ sbdCol.innerHTML = '<span class="muted">Pick an SCD to see SBDs.</span>'; return; }
          const parts = [];
          let any = false;
          (scdc.SCDs||[]).forEach(s=>{
            if(s.BPCKs && s.BPCKs.length){
              if(!any){ parts.push(`<div class="section-head"><h3>BPCKs</h3><div class="section-sub">{X (ingredient + strength + dose form) / Y (ingredient + strength + dose form)} Pack [brand name]. X and Y are quantities (e.g., number of pills for each product).</div></div>`); }
              any = true;
              parts.push(`<div class="muted"><strong>${escapeHtml(s.Name)}</strong></div>`);
              parts.push(renderPackListBare(s.BPCKs));
            }
          });
          parts.push('<div class="muted">Select an SCD to see SBDs.</div>');
          sbdCol.innerHTML = parts.join('\n');
          return;
        }
        const parts = [];
        const sbds = scd.SBDs || [];
        const sbdCount = sbds.length;
        if(!sbdCount){
          parts.push(`<div class="section-head"><h3>SBDs (0)</h3><div class="section-sub">(ingredient + strength + dose form + [brand name])</div></div>`);
          parts.push('<div class="muted">No SBDs.</div>');
          sbdCol.innerHTML = parts.join('');
          return;
        }

        const bnGroups = new Map();
        const unbrandedSbds = [];
        sbds.forEach(sbd=>{
          const bns = sbd.BNs || [];
          if(!bns.length){
            unbrandedSbds.push(sbd);
            return;
          }
          bns.forEach(bn=>{
            const key = bn.RXCUI || bn.Name || 'unknown';
            if(!bnGroups.has(key)){ bnGroups.set(key, { bn, sbds: [] }); }
            bnGroups.get(key).sbds.push(sbd);
          });
        });

        const groups = Array.from(bnGroups.values()).sort((a,b)=> (a.bn.Name||'').localeCompare(b.bn.Name||''));
        parts.push(`<div class="section-head"><h3>SBDs (${sbdCount})</h3><div class="section-sub">SBD = ingredient + strength + dose form + [brand name]</div></div>`);
        groups.forEach(group=>{
          const bn = group.bn;
          let html = `<div class="card"><div class="line brand-name"><strong>${escapeHtml(bn.Name)}</strong><span class="pill">${bn.TTY}</span></div>`;
          html += `<div class="mono muted rxcui-line"><strong>RXCUI</strong> ${renderRxcui(bn.RXCUI)}</div>`;
          if(bn.SPL_SET_IDs && bn.SPL_SET_IDs.length){
            const urlS = buildDailyMedSearchUrl(bn.SPL_SET_IDs, null);
            html += `<details><summary>SPL Set IDs</summary><div class=\"mono\">${bn.SPL_SET_IDs.join(', ')}</div><div><a href=\"${urlS}\" target=\"_blank\" rel=\"noopener\">DailyMed</a></div></details>`;
          }
          html += `<hr class="subtle-rule"><ul class="list nested-list">`;
          group.sbds
            .slice()
            .sort((a,b)=> (a.Name||'').localeCompare(b.Name||''))
            .forEach(sbd=>{ html += renderSbdListItem(sbd); });
          html += `</ul></div>`;
          parts.push(html);
        });

        if(unbrandedSbds.length){
          parts.push(`<div class="section-head"><h3>SBDs without BN (${unbrandedSbds.length})</h3></div>`);
          parts.push(`<ul class="list nested-list">${unbrandedSbds.map(renderSbdListItem).join('')}</ul>`);
        }

        // BPCKs section under SBDs
        if(scd.BPCKs && scd.BPCKs.length){
          parts.push(`<div class="section-head"><h3>BPCKs (${scd.BPCKs.length})</h3><div class="section-sub">{X (ingredient + strength + dose form) / Y (ingredient + strength + dose form)} Pack [brand name]. X and Y are quantities (e.g., number of pills for each product).</div></div>`);
          parts.push(renderPackListBare(scd.BPCKs));
        }
        sbdCol.innerHTML = parts.join('\n');
      }

      function renderSbdListItem(sbd){
        let html = `<li><div><strong>${escapeHtml(sbd.Name)}</strong> <span class="pill">${sbd.TTY}</span></div>`;
        html += `<div class="mono muted rxcui-line"><strong>RXCUI</strong> ${renderRxcui(sbd.RXCUI)}</div>`;
        if(sbd.NDCs && sbd.NDCs.length){
          const urlN = buildDailyMedSearchUrl(null, sbd.NDCs);
          html += `<details><summary>NDCs</summary><div class=\"mono\">${sbd.NDCs.join(', ')}</div><div><a href=\"${urlN}\" target=\"_blank\" rel=\"noopener\">DailyMed</a></div></details>`;
        }
        if(sbd.SPL_SET_IDs && sbd.SPL_SET_IDs.length){
          const urlS = buildDailyMedSearchUrl(sbd.SPL_SET_IDs, null);
          html += `<details><summary>SPL Set IDs</summary><div class=\"mono\">${sbd.SPL_SET_IDs.join(', ')}</div><div><a href=\"${urlS}\" target=\"_blank\" rel=\"noopener\">DailyMed</a></div></details>`;
        }
        html += `</li>`;
        return html;
      }

      function renderPackList(label, arr){
        let html = `<div class="muted"><strong>${label}s</strong></div><ul class="list">`;
        arr.forEach(p=>{
          html += `<li><div>${escapeHtml(p.Name)} <span class="pill">${p.TTY}</span></div>
                   <div class="mono muted rxcui-line"><strong>RXCUI</strong> ${renderRxcui(p.RXCUI)}</div>`;
          if(p.NDCs && p.NDCs.length){
            const urlN = buildDailyMedSearchUrl(null, p.NDCs);
            html += `<details><summary>NDCs</summary><div class=\"mono\">${p.NDCs.join(', ')}</div><div><a href=\"${urlN}\" target=\"_blank\" rel=\"noopener\">DailyMed</a></div></details>`;
          }
          if(p.SPL_SET_IDs && p.SPL_SET_IDs.length){
            const urlS = buildDailyMedSearchUrl(p.SPL_SET_IDs, null);
            html += `<details><summary>SPL Set IDs</summary><div class=\"mono\">${p.SPL_SET_IDs.join(', ')}</div><div><a href=\"${urlS}\" target=\"_blank\" rel=\"noopener\">DailyMed</a></div></details>`;
          }
          html += `</li>`;
        });
        html += `</ul>`;
        return html;
      }
      function renderPackListBare(arr){
        let html = `<ul class="list">`;
        arr.forEach(p=>{
          html += `<li><div>${escapeHtml(p.Name)} <span class="pill">${p.TTY}</span></div>
                   <div class="mono muted rxcui-line"><strong>RXCUI</strong> ${renderRxcui(p.RXCUI)}</div>`;
          if(p.NDCs && p.NDCs.length){
            const urlN = buildDailyMedSearchUrl(null, p.NDCs);
            html += `<details><summary>NDCs</summary><div class=\"mono\">${p.NDCs.join(', ')}</div><div><a href=\"${urlN}\" target=\"_blank\" rel=\"noopener\">DailyMed</a></div></details>`;
          }
          if(p.SPL_SET_IDs && p.SPL_SET_IDs.length){
            const urlS = buildDailyMedSearchUrl(p.SPL_SET_IDs, null);
            html += `<details><summary>SPL Set IDs</summary><div class=\"mono\">${p.SPL_SET_IDs.join(', ')}</div><div><a href=\"${urlS}\" target=\"_blank\" rel=\"noopener\">DailyMed</a></div></details>`;
          }
          html += `</li>`;
        });
        html += `</ul>`;
        return html;
      }

      function renderSqlPanel(){
        if(!state.selected){
          sqlSummaryEl.textContent = 'Select an ingredient to generate a UNII to NDC query.';
          sqlQueryEl.value = 'Select an ingredient to generate a query.';
          resizeSqlQuery();
          copySqlBtn.disabled = true;
          return;
        }
        sqlSummaryEl.textContent = buildSqlSummary();
        sqlQueryEl.value = buildSqlQuery();
        resizeSqlQuery();
        copySqlBtn.disabled = false;
      }

      function resizeSqlQuery(){
        sqlQueryEl.style.height = 'auto';
        sqlQueryEl.style.height = `${sqlQueryEl.scrollHeight + 2}px`;
      }

      function buildSqlSummary(){
        const parts = [];
        const ing = state.selected;
        parts.push(`${ing.UNII ? `UNII ${ing.UNII}` : 'No UNII on selected ingredient'}`);
        parts.push(`${ing.TTY} ${ing.RXCUI}`);
        if(state.selectedScdc){ parts.push(`SCDC ${state.selectedScdc.RXCUI}`); }
        if(state.selectedScd){ parts.push(`SCD ${state.selectedScd.RXCUI}`); }
        return parts.join(' · ');
      }

      function sqlLiteral(value){
        if(value === null || value === undefined || value === '') return 'cast(null as varchar2(64))';
        return `'${String(value).replace(/'/g, "''")}'`;
      }

      function sqlComment(value){
        return String(value || '').replace(/[\r\n]+/g, ' ').replace(/\*\//g, '');
      }

      function buildSqlQuery(){
        const ing = state.selected;
        const scdc = state.selectedScdc;
        const scd = state.selectedScd;
        return String.raw`-- Generated by RxNorm Ingredients Browser.
-- Current state: ${sqlComment(ing.Name)} (${ing.TTY} ${ing.RXCUI})${ing.UNII ? `, UNII ${sqlComment(ing.UNII)}` : ''}${scdc ? `, SCDC ${sqlComment(scdc.RXCUI)}` : ''}${scd ? `, SCD ${sqlComment(scd.RXCUI)}` : ''}
-- Oracle over RxNorm RRF tables: RXNCONSO, RXNREL, RXNSAT.

with
params as (
  select ${sqlLiteral(ing.UNII)} as unii,
         ${sqlLiteral(ing.RXCUI)} as ingredient_rxcui,
         ${sqlLiteral(scdc && scdc.RXCUI)} as scdc_rxcui,
         ${sqlLiteral(scd && scd.RXCUI)} as scd_rxcui
  from dual
),
term_rows as (
  select rxcui, tty, str as name,
         row_number() over (
           partition by rxcui, tty
           order by case when ts = 'P' then 0 else 1 end, rxaui, str
         ) rn
  from rxnconso
  where sab = 'RXNORM'
    and suppress = 'N'
    and lat = 'ENG'
    and tty in ('IN','PIN','MIN','SCDC','SCD','GPCK','BPCK','SBD')
),
concepts as (
  select rxcui, tty, name
  from term_rows
  where rn = 1
),
unii_map as (
  select rxcui, min(code) keep (dense_rank first order by code) as unii
  from rxnconso
  where sab = 'MTHSPL'
    and tty = 'SU'
    and code is not null
  group by rxcui
),
ingredients as (
  select c.rxcui, c.tty, c.name, u.unii
  from concepts c
  left join unii_map u on u.rxcui = c.rxcui
  cross join params p
  where c.tty in ('IN','PIN','MIN')
    and (p.unii is not null or p.ingredient_rxcui is not null)
    and (p.unii is null or upper(u.unii) = upper(p.unii))
    and (p.ingredient_rxcui is null or c.rxcui = p.ingredient_rxcui)
),
edges as (
  select r.rxcui1, r.rxcui2, r.rela,
         c1.tty as tty1, c2.tty as tty2
  from rxnrel r
  join concepts c1 on c1.rxcui = r.rxcui1
  join concepts c2 on c2.rxcui = r.rxcui2
  where r.sab = 'RXNORM'
    and r.stype1 = 'CUI'
    and r.stype2 = 'CUI'
),
ing_to_scdc_direct as (
  select distinct e.rxcui1 ingredient_rxcui, e.rxcui2 scdc_rxcui, e.rela
  from edges e
  where e.rela in ('has_ingredient','ingredient_of')
    and e.tty1 in ('IN','PIN','MIN')
    and e.tty2 = 'SCDC'
  union
  select distinct e.rxcui2, e.rxcui1, e.rela
  from edges e
  where e.rela in ('has_ingredient','ingredient_of')
    and e.tty2 in ('IN','PIN','MIN')
    and e.tty1 = 'SCDC'
  union
  select distinct e.rxcui1, e.rxcui2, e.rela
  from edges e
  where e.rela in ('has_precise_ingredient','precise_ingredient_of')
    and e.tty1 = 'PIN'
    and e.tty2 = 'SCDC'
  union
  select distinct e.rxcui2, e.rxcui1, e.rela
  from edges e
  where e.rela in ('has_precise_ingredient','precise_ingredient_of')
    and e.tty2 = 'PIN'
    and e.tty1 = 'SCDC'
),
scdc_to_scd as (
  select distinct e.rxcui2 scdc_rxcui, e.rxcui1 scd_rxcui
  from edges e
  where e.rela = 'constitutes' and e.tty1 = 'SCD' and e.tty2 = 'SCDC'
  union
  select distinct e.rxcui1, e.rxcui2
  from edges e
  where e.rela = 'constitutes' and e.tty1 = 'SCDC' and e.tty2 = 'SCD'
),
scd_to_scdc as (
  select scd_rxcui, scdc_rxcui from scdc_to_scd
),
pin_to_scdc_inherited as (
  select distinct e.rxcui2 ingredient_rxcui, d.scdc_rxcui
  from edges e
  join ing_to_scdc_direct d on d.ingredient_rxcui = e.rxcui1
  join concepts ci on ci.rxcui = d.ingredient_rxcui and ci.tty = 'IN'
  where e.rela in ('has_precise_ingredient','precise_ingredient_of')
    and e.tty1 = 'IN' and e.tty2 = 'PIN'
  union
  select distinct e.rxcui1, d.scdc_rxcui
  from edges e
  join ing_to_scdc_direct d on d.ingredient_rxcui = e.rxcui2
  join concepts ci on ci.rxcui = d.ingredient_rxcui and ci.tty = 'IN'
  where e.rela in ('has_precise_ingredient','precise_ingredient_of')
    and e.tty2 = 'IN' and e.tty1 = 'PIN'
),
min_to_scdc as (
  select distinct e.rxcui1 ingredient_rxcui, d.scdc_rxcui
  from edges e
  join ing_to_scdc_direct d on d.ingredient_rxcui = e.rxcui2
  where e.rela in ('has_ingredient','has_ingredients','ingredients_of')
    and e.tty1 = 'MIN' and e.tty2 = 'IN'
  union
  select distinct e.rxcui2, d.scdc_rxcui
  from edges e
  join ing_to_scdc_direct d on d.ingredient_rxcui = e.rxcui1
  where e.rela in ('has_ingredient','has_ingredients','ingredients_of')
    and e.tty2 = 'MIN' and e.tty1 = 'IN'
  union
  select distinct e.rxcui1, s.scdc_rxcui
  from edges e
  join scd_to_scdc s on s.scd_rxcui = e.rxcui2
  where e.rela in ('has_ingredient','has_ingredients','ingredients_of')
    and e.tty1 = 'MIN' and e.tty2 = 'SCD'
  union
  select distinct e.rxcui2, s.scdc_rxcui
  from edges e
  join scd_to_scdc s on s.scd_rxcui = e.rxcui1
  where e.rela in ('has_ingredient','has_ingredients','ingredients_of')
    and e.tty2 = 'MIN' and e.tty1 = 'SCD'
),
in_pin_forms as (
  select distinct e.rxcui1 in_rxcui, e.rxcui2 pin_rxcui
  from edges e
  where e.rela in ('form_of','has_form')
    and e.tty1 = 'IN' and e.tty2 = 'PIN'
  union
  select distinct e.rxcui2, e.rxcui1
  from edges e
  where e.rela in ('form_of','has_form')
    and e.tty2 = 'IN' and e.tty1 = 'PIN'
),
boss_from as (
  select rxcui product_rxcui,
         regexp_substr(atv, '\{([^}]+)\}', 1, 1, null, 1) scdc_rxcui,
         regexp_substr(atv, '\}[[:space:]]+([A-Z]+)', 1, 1, null, 1) basis
  from rxnsat
  where sab = 'RXNORM'
    and atn = 'RXN_BOSS_FROM'
    and suppress = 'N'
),
product_terms as (
  select distinct rxcui product_rxcui,
         trim(regexp_replace(regexp_replace(lower(str), '[^a-z0-9]+', ' '), ' +', ' ')) term_key
  from rxnconso
  where suppress = 'N'
    and sab in ('RXNORM','MTHSPL')
    and str is not null
),
pin_names as (
  select rxcui pin_rxcui,
         trim(regexp_replace(regexp_replace(lower(name), '[^a-z0-9]+', ' '), ' +', ' ')) pin_key
  from concepts
  where tty = 'PIN'
),
scdc_to_ins as (
  select distinct d.scdc_rxcui, d.ingredient_rxcui in_rxcui
  from ing_to_scdc_direct d
  join concepts c on c.rxcui = d.ingredient_rxcui and c.tty = 'IN'
),
scdc_to_pins as (
  select distinct d.scdc_rxcui, d.ingredient_rxcui pin_rxcui
  from ing_to_scdc_direct d
  join concepts c on c.rxcui = d.ingredient_rxcui and c.tty = 'PIN'
),
boss_pin_to_scdc as (
  select distinct f.pin_rxcui ingredient_rxcui, b.scdc_rxcui
  from boss_from b
  join scdc_to_ins si on si.scdc_rxcui = b.scdc_rxcui
  join in_pin_forms f on f.in_rxcui = si.in_rxcui
  join pin_names pn on pn.pin_rxcui = f.pin_rxcui
  join product_terms pt on pt.product_rxcui = b.product_rxcui
  where b.basis = 'AM'
    and instr(pt.term_key, pn.pin_key) > 0
),
boss_in_to_scdc as (
  select distinct f.in_rxcui ingredient_rxcui, b.scdc_rxcui
  from boss_from b
  join scdc_to_pins sp on sp.scdc_rxcui = b.scdc_rxcui
  join in_pin_forms f on f.pin_rxcui = sp.pin_rxcui
  where b.basis = 'AI'
),
ingredient_to_scdc as (
  select d.ingredient_rxcui, d.scdc_rxcui, 'direct ' || d.rela as ingredient_path
  from ing_to_scdc_direct d
  join concepts c on c.rxcui = d.ingredient_rxcui and c.tty in ('IN','PIN')
  union
  select ingredient_rxcui, scdc_rxcui, 'pin inherited from IN precise ingredient'
  from pin_to_scdc_inherited
  union
  select ingredient_rxcui, scdc_rxcui, 'min inherited from IN/SCD ingredient'
  from min_to_scdc
  union
  select ingredient_rxcui, scdc_rxcui, 'BoSS AM matched PIN form'
  from boss_pin_to_scdc
  union
  select ingredient_rxcui, scdc_rxcui, 'BoSS AI propagated to IN form'
  from boss_in_to_scdc
),
ndc_values as (
  select distinct rxcui, atv ndc
  from rxnsat
  where sab = 'RXNORM'
    and atn = 'NDC'
    and suppress = 'N'
    and atv is not null
),
scd_to_gpck as (
  select distinct case when tty1 = 'SCD' then rxcui1 else rxcui2 end scd_rxcui,
                  case when tty1 = 'GPCK' then rxcui1 else rxcui2 end gpck_rxcui
  from edges
  where rela in ('contains','contained_in')
    and ((tty1 = 'SCD' and tty2 = 'GPCK') or (tty2 = 'SCD' and tty1 = 'GPCK'))
),
scd_to_bpck as (
  select distinct case when tty1 = 'SCD' then rxcui1 else rxcui2 end scd_rxcui,
                  case when tty1 = 'BPCK' then rxcui1 else rxcui2 end bpck_rxcui
  from edges
  where rela in ('contains','contained_in')
    and ((tty1 = 'SCD' and tty2 = 'BPCK') or (tty2 = 'SCD' and tty1 = 'BPCK'))
),
scd_to_sbd as (
  select distinct case when tty1 = 'SCD' then rxcui1 else rxcui2 end scd_rxcui,
                  case when tty1 = 'SBD' then rxcui1 else rxcui2 end sbd_rxcui
  from edges
  where rela in ('has_tradename','tradename_of')
    and ((tty1 = 'SCD' and tty2 = 'SBD') or (tty2 = 'SCD' and tty1 = 'SBD'))
),
all_ndc_paths as (
  select 'SCD_NDC' ndc_path, s.scd_rxcui owner_rxcui, s.scd_rxcui, n.ndc
  from scdc_to_scd s join ndc_values n on n.rxcui = s.scd_rxcui
  union all
  select 'GPCK_NDC', g.gpck_rxcui, g.scd_rxcui, n.ndc
  from scd_to_gpck g join ndc_values n on n.rxcui = g.gpck_rxcui
  union all
  select 'BPCK_NDC', b.bpck_rxcui, b.scd_rxcui, n.ndc
  from scd_to_bpck b join ndc_values n on n.rxcui = b.bpck_rxcui
  union all
  select 'SBD_NDC', s.sbd_rxcui, s.scd_rxcui, n.ndc
  from scd_to_sbd s join ndc_values n on n.rxcui = s.sbd_rxcui
)
select distinct
       i.unii,
       i.rxcui ingredient_rxcui,
       i.tty ingredient_tty,
       i.name ingredient_name,
       i2s.ingredient_path,
       scdc.rxcui scdc_rxcui,
       scdc.name scdc_name,
       scd.rxcui scd_rxcui,
       scd.name scd_name,
       p.ndc_path,
       owner.tty ndc_owner_tty,
       owner.rxcui ndc_owner_rxcui,
       owner.name ndc_owner_name,
       p.ndc
from ingredients i
join ingredient_to_scdc i2s on i2s.ingredient_rxcui = i.rxcui
join concepts scdc on scdc.rxcui = i2s.scdc_rxcui and scdc.tty = 'SCDC'
join scdc_to_scd s2s on s2s.scdc_rxcui = i2s.scdc_rxcui
join concepts scd on scd.rxcui = s2s.scd_rxcui and scd.tty = 'SCD'
join all_ndc_paths p on p.scd_rxcui = s2s.scd_rxcui
join concepts owner on owner.rxcui = p.owner_rxcui
cross join params prm
where (prm.scdc_rxcui is null or scdc.rxcui = prm.scdc_rxcui)
  and (prm.scd_rxcui is null or scd.rxcui = prm.scd_rxcui)
order by ingredient_name, scdc_name, scd_name, ndc_path, ndc_owner_name, ndc;`;
      }

      function buildDailyMedSearchUrl(ids, ndcs){
        const terms = [];
        if(ids && ids.length){ ids.forEach(id=> terms.push(`SETID:(${id})`)); }
        if(ndcs && ndcs.length){ ndcs.forEach(n=> terms.push(`NDC:(${n})`)); }
        if(!terms.length) return '#';
        const q = terms.join(' OR ');
        const enc = encodeURIComponent(q).replace(/%20/g,'+');
        return `https://dailymed.nlm.nih.gov/dailymed/search.cfm?adv=1&labeltype=all&query=${enc}`;
      }
      function renderDailyMedLink(ids, ndcs){
        const url = buildDailyMedSearchUrl(ids, ndcs);
        return `<a href="${url}" target="_blank" rel="noopener">DailyMed</a>`;
      }
      function buildRxNavUrl(rxcui){
        return `https://mor.nlm.nih.gov/RxNav/search?searchBy=NameOrCode&searchTerm=${encodeURIComponent(rxcui||'')}`;
      }
      function renderRxcui(rxcui){
        const value = escapeHtml(String(rxcui||''));
        if(!value) return '';
        return `<a class="rxnav-link" href="${buildRxNavUrl(rxcui)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${value}</a>`;
      }

      function escapeHtml(s){
        return (s||'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
      }
    </script>
